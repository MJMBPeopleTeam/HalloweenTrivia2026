<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f1ee; --surface:#ffffff; --ink:#111; --muted:#666; --line:#ddd; --accent:#d61f1f; --on-accent:#fff; --ok:#1a7f4b;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --cond:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0e;--surface:#171718;--ink:#eee;--muted:#999;--line:#2a2a2c;--accent:#ff3b30;--on-accent:#fff;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0e;--surface:#171718;--ink:#eee;--muted:#999;--line:#2a2a2c;--accent:#ff3b30;--on-accent:#fff;--ok:#4ade80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #ff4a3d;outline-offset:3px}
h1,h2{margin:0;font-weight:800}
#app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column}

/* preview toolbar */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px 12px;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.demo .note{color:var(--muted)}
.tb{border:1px solid var(--line);border-radius:8px;padding:6px 14px;background:transparent;color:var(--ink);white-space:nowrap}
.tb.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* ---------------- world ---------------- */
#world{position:fixed;z-index:1;overflow:hidden;background:#000;display:none;pointer-events:none}
#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:-60%;opacity:.16;mix-blend-mode:overlay;animation:grain .7s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(4%,-5%)}60%{transform:translate(-3%,7%)}80%{transform:translate(7%,2%)}100%{transform:translate(-4%,-3%)}}
.fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease}
#world.swap .fade{opacity:1}
.pulse{position:absolute;inset:0}
#world.urgent .pulse{animation:heart 1s infinite}
@keyframes heart{0%,100%{box-shadow:inset 0 0 90px 10px rgba(170,0,0,.25)}15%{box-shadow:inset 0 0 180px 60px rgba(210,0,0,.6)}30%{box-shadow:inset 0 0 110px 20px rgba(170,0,0,.3)}45%{box-shadow:inset 0 0 160px 45px rgba(210,0,0,.5)}}

/* ---------------- stage ---------------- */
.stage{position:relative;flex:1;display:flex;flex-direction:column;color:#f5f1ea;min-height:100vh;min-height:100dvh}
body{background:#000}
.phone{min-height:100vh;min-height:100dvh}
.missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#999;font-size:.95rem}
.status{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:60}
.err{color:#ff8a80;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.content{position:relative;flex:1;display:flex;flex-direction:column;gap:clamp(12px,2vw,24px);width:100%;max-width:1400px;margin:0 auto;padding:clamp(20px,3vw,44px)}
.stage :is(h1,h2,.qtext,.where,.answered,.hint,.fact,.row,.pod,.tag2,.billing,.presents,.date,.foot,.big,.chip,p){text-shadow:0 2px 24px rgba(0,0,0,.8)}
.meta{font-family:var(--cond);font-stretch:75%;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(.72rem,.95vw,.9rem)}
.btn{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:13px 28px;font-family:var(--cond);font-stretch:75%;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:.9rem;background:#e01b1b;color:#fff;white-space:nowrap;flex:none;box-shadow:0 0 40px rgba(230,20,20,.45)}
.btn.quiet{background:rgba(255,255,255,.06);box-shadow:none;backdrop-filter:blur(10px)}
.btn:hover{filter:brightness(1.12)}
.glow{color:#fff;text-shadow:0 0 12px rgba(255,40,30,.9),0 0 40px rgba(255,0,0,.7),0 0 90px rgba(200,0,0,.6)!important}

/* poster lobby */
.poster{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.presents{color:#d8d2c8}
.ptitle{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(5rem,15vw,15rem);line-height:.82;letter-spacing:-.005em;margin-top:auto}
.tagline{font-stretch:100%;font-weight:300;font-style:italic;font-size:clamp(1.1rem,1.8vw,1.6rem);color:#e9e2d8;margin:6px 0 0}
.billing{font-family:var(--cond);font-stretch:62%;font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(.9rem,1.2vw,1.15rem);line-height:1.35;color:#cfc7bb;max-width:110ch;margin-top:auto}
.billing b{font-weight:800;color:#fff;letter-spacing:.14em}
.billing .sep{opacity:.45;padding:0 .5em}
.date{text-transform:uppercase;font-family:var(--cond);font-stretch:62%;font-weight:800;letter-spacing:.22em;color:#ff3b30;font-size:clamp(1.2rem,1.8vw,1.7rem);margin-top:6px}
.lobbyrow{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.qrbox{display:flex;align-items:center;gap:14px;text-align:left}
.qrbox img{width:clamp(120px,10vw,170px);height:auto;display:block;background:#fff;padding:8px;border-radius:6px;image-rendering:pixelated}
.qrbox .meta{color:#e6dfd5;line-height:1.8}
.count{font-family:var(--cond);font-stretch:62%;font-weight:800;font-size:clamp(2rem,3.4vw,3rem);line-height:1}

/* question */
.qtop{display:grid;grid-template-columns:1fr auto;gap:clamp(14px,3vw,40px);align-items:start}
.where{color:#e2d8cb}
.qtext{font-weight:700;font-stretch:88%;letter-spacing:-.01em;font-size:clamp(1.9rem,3.5vw,3.4rem);line-height:1.04;max-width:30ch;margin-top:10px}
.qside{display:flex;gap:28px;align-items:center}
.answered{text-align:right;color:#cfc6b9}
.answered b{display:block;font-family:var(--cond);font-stretch:62%;font-weight:800;letter-spacing:0;font-size:clamp(2.6rem,4.4vw,4.2rem);line-height:.9;color:#fff}
.ring{flex:none;position:relative;width:clamp(86px,8.5vw,120px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{stroke:rgba(255,255,255,.12)}
.ring .arc{stroke:#fff;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-stretch:62%;font-weight:800;font-size:clamp(2.4rem,3.8vw,3.6rem);color:#fff}
.ring.low .arc{stroke:#ff2a1f;filter:drop-shadow(0 0 10px #ff0000)}
.ring.low .num{color:#fff;text-shadow:0 0 14px #ff1a1a,0 0 40px #ff0000;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;gap:clamp(12px,1.6vw,20px)}
.qbody.pic{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);align-items:stretch}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,14px)}
.qbody.pic .answers{grid-template-rows:1fr 1fr}
.ans{--k:#ff3b30;position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:18px;padding:clamp(14px,1.6vw,22px) clamp(80px,8vw,140px) clamp(14px,1.6vw,22px) clamp(20px,2vw,30px);border-radius:4px;border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(90deg,color-mix(in srgb,var(--k) 24%,transparent),transparent 58%),rgba(6,6,8,.66);backdrop-filter:blur(16px);color:#fff;text-align:left;font-family:var(--font);font-weight:600;font-stretch:92%;font-size:clamp(1.15rem,1.9vw,1.85rem);line-height:1.1;min-height:clamp(66px,10vh,124px);transition:opacity .5s,transform .5s,background .6s,border-color .5s,box-shadow .5s}
.ans::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k);box-shadow:0 0 16px 1px var(--k),0 0 70px 10px color-mix(in srgb,var(--k) 45%,transparent)}
.ans .ltr{position:absolute;right:-.04em;bottom:-.2em;z-index:-1;font-family:var(--cond);font-stretch:62%;font-weight:900;font-size:clamp(5.5rem,10vw,10rem);line-height:1;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--k) 75%,transparent);opacity:.6;text-shadow:none!important;transition:color .6s,opacity .6s}
.ans .key{flex:none;width:clamp(22px,1.9vw,32px);display:flex;filter:drop-shadow(0 0 6px var(--k)) drop-shadow(0 0 18px var(--k))}
.ans .key svg{width:100%;height:auto;fill:var(--k)}
.ans:is(button):hover{border-color:color-mix(in srgb,var(--k) 60%,transparent)}
.deal .ans{animation:dealt .7s cubic-bezier(.2,.8,.2,1) both}
.deal .a1{animation-delay:.07s}.deal .a2{animation-delay:.14s}.deal .a3{animation-delay:.21s}
@keyframes dealt{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.a0{--k:#ff3b30}.a1{--k:#ffae1a}.a2{--k:#22c3ff}.a3{--k:#a66bff}
.ans.dim{opacity:.2;transform:scale(.98);filter:grayscale(.7)}
.ans.win{border-color:var(--k);background:linear-gradient(90deg,color-mix(in srgb,var(--k) 70%,transparent),color-mix(in srgb,var(--k) 28%,rgba(6,6,8,.7)));box-shadow:0 0 0 1px var(--k),0 0 80px color-mix(in srgb,var(--k) 50%,transparent)}
.ans.win .ltr{color:color-mix(in srgb,#fff 22%,transparent);-webkit-text-stroke-color:#fff;opacity:.9}
.ans.win .key{filter:drop-shadow(0 0 6px #fff)}
.ans.win .key svg{fill:#fff}
.ans .n{margin-left:auto;font-family:var(--cond);font-stretch:62%;font-weight:800;font-size:1.5em}
.ans .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--k);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1);border-radius:0 0 14px 14px}
.panel{position:relative;border-radius:14px;overflow:hidden;min-height:0;background:#050505;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.12) saturate(.8) brightness(.92)}
.panel::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.7)),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55));pointer-events:none}
.panel.emoji{font-size:clamp(3.4rem,8vw,8rem);letter-spacing:.06em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;background:radial-gradient(ellipse at 50% 55%,rgba(255,40,30,.18),rgba(0,0,0,.65) 70%)}
.panel.emoji::after{display:none}
.slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border:1.5px dashed rgba(255,255,255,.3);border-radius:14px;color:#ddd;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 12px,transparent 12px 24px);z-index:1}
.slot strong{font-family:var(--cond);font-stretch:70%;font-weight:800;font-size:clamp(1.2rem,1.8vw,1.7rem);letter-spacing:.02em;color:#fff}
.slot span{font-size:.95rem;color:#bbb}
.slot.over{border-color:#ff3b30;background:rgba(255,40,30,.08)}
.revealbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fact{flex:1;min-width:280px;max-width:74ch;font-weight:400;font-size:clamp(1.02rem,1.4vw,1.3rem);color:#eee6da;line-height:1.4}
.fact em{font-style:normal;font-weight:700;color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.hint{font-weight:300;color:#d7cec2}

/* act card */
.act{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.act .meta{animation:fadein 1s .2s both;color:#ddd}
.act h2{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(5rem,16vw,16rem);line-height:.82;animation:title 3.4s both}
.act p{font-weight:300;font-style:italic;font-size:clamp(1.2rem,2.1vw,2rem);max-width:30ch;margin:0;color:#ece4d8;animation:fadein 1.2s 1s both}
@keyframes title{0%{opacity:0;letter-spacing:.3em;filter:blur(16px)}40%{opacity:1;letter-spacing:-.005em;filter:blur(0)}100%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bars::before,.bars::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:3;animation:bar 3.4s both}
.bars::before{top:0}.bars::after{bottom:0}
@keyframes bar{0%{height:0}20%,85%{height:9vh}100%{height:0}}

/* boards */
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.headrow h2{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(3.4rem,7vw,7rem);line-height:.85}
.board{display:flex;flex-direction:column;max-width:1000px;width:100%;margin:auto}
.row{display:grid;grid-template-columns:3ch 1fr auto;gap:24px;align-items:baseline;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.14);font-weight:600;font-stretch:90%;font-size:clamp(1.3rem,2.3vw,2.1rem);animation:fadein .5s both}
.row .rk{font-family:var(--cond);font-stretch:62%;font-weight:800;color:#ff3b30}
.row .pts{font-family:var(--cond);font-stretch:70%;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:24px;align-items:end;max-width:1100px;width:100%;margin:0 auto;text-align:center}
.pod .nm{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:clamp(2.2rem,4.4vw,4.2rem);line-height:.9;margin:8px 0}
.pod.p1 .nm{font-size:clamp(3.2rem,7vw,6.6rem)}
.pod .pts{font-family:var(--cond);font-stretch:70%;letter-spacing:.14em;color:#ddd}

/* phone */
.phoneframe{width:min(390px,100%);margin:18px auto;height:790px;max-height:calc(100vh - 90px);min-height:600px;border:10px solid #111;border-radius:48px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.phoneframe .stage{min-height:0}
.phone{flex:1;display:flex;flex-direction:column;gap:12px;padding:22px 14px 18px;min-height:0}
.phone .qtext{font-size:1.35rem;max-width:none;margin-top:6px}
.phone .meta{font-size:.68rem;letter-spacing:.24em}
.phone .answers{gap:8px;flex:1;grid-template-rows:1fr 1fr}
.phone .ans{flex-direction:column;justify-content:center;text-align:center;font-size:1.02rem;gap:10px;min-height:0;padding:10px 8px}
.phone .ans .key{width:30px}
.phone .ans .ltr{font-size:6rem}
.phone .panel{flex:0 0 30%}
.phone .panel.emoji{font-size:2.8rem}
.phone .ring{width:66px}.phone .ring .num{font-size:2rem}
.ptop{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.big{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:4.2rem;line-height:.85}
.chip{font-family:var(--cond);font-stretch:75%;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.85rem;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.good{color:#fff;text-shadow:0 0 30px #22ff88!important}.badc{color:#fff}
.foot{display:flex;justify-content:space-between;font-family:var(--cond);font-stretch:75%;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;color:#d6cdc1}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.field input{font-size:1.1rem;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;cursor:text}

/* question list */
.qlist{max-width:1000px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:12px;width:100%}
.qlist h2{font-family:var(--cond);font-stretch:62%;font-weight:900;text-transform:uppercase;font-size:3.4rem;line-height:.9}
.actHead{font-family:var(--cond);font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:1.9rem;margin-top:18px;color:var(--accent)}
.qi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:18px}
.qi h3{margin:4px 0 8px;font-size:1.15rem;font-weight:700}
.qi ol{margin:0 0 8px;padding-left:1.4em;columns:2;column-gap:28px}
.qi li.right{color:var(--ok);font-weight:700}
.qi p{margin:0;color:var(--muted)}
.qi .thumb{width:200px;height:130px;display:flex}
.qi .thumb .panel{flex:1}
.qi .thumb .slot strong{font-size:1rem}.qi .thumb .slot span{font-size:.8rem}
.qi .thumb .panel.emoji{font-size:2rem}
.tag{font-size:.85rem;color:var(--muted)}
.intro{color:var(--muted);max-width:70ch}

@media (max-width:820px){
  .qbody.pic{grid-template-columns:1fr}.answers{grid-template-columns:1fr}
  .lobbyrow{flex-direction:column;align-items:center}
  .qi{grid-template-columns:1fr}.qi ol{columns:1}
}
.phone .answers{grid-template-columns:1fr 1fr!important;grid-template-rows:1fr 1fr}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  function setMood(k){
    if(!ctx||mood===k) return; mood=k; const m=MOODS[k]||MOODS[0], t=ctx.currentTime;
    N.oscs.forEach(({o,m:mm})=>o.frequency.setTargetAtTime(m.root*mm,t,1.5)); N.sub.frequency.setTargetAtTime(m.root/2,t,1.5);
    N.filt.frequency.setTargetAtTime(m.cut,t,1.5); N.windG.gain.setTargetAtTime(m.wind,t,1.5); N.highG.gain.setTargetAtTime(m.high,t,1.5); N.tlG.gain.setTargetAtTime(m.trem,t,1);
  }
  function pluck(f,g){const t=ctx.currentTime,o=ctx.createOscillator(),o2=ctx.createOscillator(),e=ctx.createGain(),e2=ctx.createGain();o.frequency.value=f;o2.frequency.value=f*2.01;o.detune.value=(Math.random()-.5)*20;e2.gain.value=.3;
    o2.connect(e2).connect(e);o.connect(e);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.005);e.gain.exponentialRampToValueAtTime(.0001,t+2.8);e.connect(bus);o.start(t);o2.start(t);o.stop(t+3);o2.stop(t+3);}
  function box(){
    if(!on) return; const m=MOODS[mood]||MOODS[0];
    const f=m.root*Math.pow(2,(Math.random()<.5?4:5)+SCALE[Math.random()*SCALE.length|0]/12);
    pluck(f,m.boxG); if(Math.random()<.35) setTimeout(()=>on&&pluck(f*Math.pow(2,SCALE[Math.random()*SCALE.length|0]/12),m.boxG*.7),240);
    boxT=setTimeout(box,m.box[0]+Math.random()*(m.box[1]-m.box[0]));
  }
  function thump(t,g){const o=ctx.createOscillator(),e=ctx.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+.12);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(e).connect(master);o.start(t);o.stop(t+.4);}
  const beat=()=>{const t=ctx.currentTime;thump(t,.9);thump(t+.24,.6)};
  function urgent(v){v=!!v&&on; if(v===urg) return; urg=v; clearInterval(heartT); if(v){beat();heartT=setInterval(beat,1000);}}
  function stinger(){
    if(!on) return; const t=ctx.currentTime;
    const o=ctx.createOscillator(),e=ctx.createGain();o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(28,t+1.8);e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(1,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(e).connect(master);o.start(t);o.stop(t+3.3);
    const n=ctx.createBufferSource();n.buffer=noise(2);const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(2000,t);lp.frequency.exponentialRampToValueAtTime(100,t+1.5);const ng=ctx.createGain();ng.gain.setValueAtTime(.5,t);ng.gain.exponentialRampToValueAtTime(.0001,t+1.8);n.connect(lp).connect(ng).connect(bus);n.start(t);n.stop(t+2);
    [0,1,6,11].forEach(s=>{const c=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();c.type="sawtooth";c.frequency.value=220*Math.pow(2,s/12);c.detune.value=(Math.random()-.5)*14;f.type="lowpass";f.frequency.value=1200;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.4);g.gain.exponentialRampToValueAtTime(.0001,t+3);c.connect(f).connect(g).connect(bus);c.start(t);c.stop(t+3.1);});
  }
  function reveal(){
    if(!on) return; const t=ctx.currentTime;
    [1,2.76,5.4,8.93].forEach((p,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=196*p;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18/(i+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+3.5/(1+i*.5));o.connect(g).connect(bus);o.start(t);o.stop(t+4);});
  }
  function toggle(){
    if(!ctx) init(); on=!on;
    if(on){ ctx.resume(); master.gain.setTargetAtTime(.55,ctx.currentTime,.8); clearTimeout(boxT); boxT=setTimeout(box,1500); }
    else { master.gain.setTargetAtTime(0,ctx.currentTime,.3); clearTimeout(boxT); urgent(false); }
    lastHtml=""; render();
  }
  return{toggle,setMood,urgent,stinger,reveal,get on(){return on}};
})();

/* ---------------- live game ---------------- */
let creating=false, fb=null, offset=0, connected=false, subRun="", unsubs=[];
const now=()=>Date.now()+offset;
let state={run:"",phase:"lobby",q:0,startedAt:0};
let players={}, answers={};
let lastHtml="", qrUrl="", joinErr="", loadErr="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const PID=store.get("ht-pid")||(()=>{const v=Math.random().toString(36).slice(2,12);store.set("ht-pid",v);return v})();
let nameDraft=store.get("ht-name")||"";
const ans=(id,q)=>{const r=answers&&answers[q];return r?r[id]:undefined};

// Kahoot scoring: 1000 for an instant correct answer, sliding to 500 at the buzzer.
function pts(a,qi){ if(!a||a.c!==Q[qi].a) return 0; const t=Math.min(Math.max(+a.ms||0,0),LIMIT); return Math.round(1000*(1-(t/LIMIT)/2)); }
function revealed(){ return state.phase==="lobby"?0:state.phase==="question"?state.q:state.phase==="final"?Q.length:state.q+1; }
function standings(){ const n=revealed(); return Object.entries(players||{}).map(([id,p])=>{let s=0;for(let i=0;i<n;i++)s+=pts(ans(id,i),i);return{id,name:String((p&&p.name)||"Ghost"),score:s}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)); }
const inIntro=()=>state.phase==="question"&&now()<state.startedAt;
const curScene=()=>state.phase==="lobby"?0:state.phase==="final"?2:actOf(state.q);
const W=(path,val)=>fb.D.set(fb.D.ref(fb.db,path),val);

function setGame(p){ state={...state,...p}; render(); W("game",state).catch(e=>{loadErr="Couldn’t save to the database. Check the Firebase rules.";render()}); }
async function newGame(){ await Promise.all([W("players",null),W("answers",null)]).catch(()=>{}); setGame({run:Math.random().toString(36).slice(2,9),phase:"lobby",q:0,startedAt:0}); }
function startQ(i){ setGame({phase:"question",q:i,startedAt:now()+(ACTS.some(A=>A.from===i)?INTRO:0)}); }
function next(){
  const p=state.phase;
  if(p==="lobby") startQ(0);
  else if(p==="question"){ if(!inIntro()) setGame({phase:"reveal"}); }
  else if(p==="reveal"||p==="board") state.q>=Q.length-1?setGame({phase:"final"}):startQ(state.q+1);
}
function showBoard(){ if(state.phase==="reveal"&&state.q<Q.length-1) setGame({phase:"board"}); }
function resetGame(){ if(confirm("Start a brand new game? Everyone will need to join again.")) newGame(); }

function join(){
  const name=(nameDraft||"").trim().slice(0,20);
  if(!name){ joinErr="Type a name first."; render(); return; }
  if(!state.run){ joinErr="The host hasn’t opened the game yet."; render(); return; }
  joinErr=""; store.set("ht-name",name);
  players={...players,[PID]:{name}}; render();
  W(`players/${state.run}/${PID}`,{name,t:now()}).catch(()=>{joinErr="Couldn’t join. Check your connection and try again.";render()});
}
function answer(c){
  const q=state.q;
  if(state.phase!=="question"||inIntro()||ans(PID,q)) return;
  const ms=now()-state.startedAt; if(ms>LIMIT) return;
  answers={...answers,[q]:{...(answers[q]||{}),[PID]:{c,ms}}}; render();
  W(`answers/${state.run}/${q}/${PID}`,{c,ms:Math.max(0,Math.round(ms))});
}

const CIRC=2*Math.PI*46;
const ring=()=>`<div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="2"/><circle class="arc" cx="50" cy="50" r="46" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="0"/></svg><div class="num">15</div></div>`;
function drawTimer(){
  const host=ROLE==="host";
  if(state.phase!=="question"||inIntro()){ World.urgent(false); if(host) Sound.urgent(false); return; }
  const left=Math.max(0,LIMIT-(now()-state.startedAt));
  const a=$(".ring .arc"),n=$(".ring .num"),r=$(".ring");
  if(a) a.style.strokeDashoffset=(CIRC*(1-left/LIMIT)).toFixed(1);
  if(n) n.textContent=Math.ceil(left/1000);
  if(r) r.classList.toggle("low",left<=5000);
  World.urgent(left>0&&left<=5000); if(host) Sound.urgent(left>0&&left<=5000);
}
function tick(){
  if(state.phase!=="question") return;
  render();
  if(ROLE!=="host"||inIntro()) return;
  const left=LIMIT-(now()-state.startedAt), ids=Object.keys(players||{});
  const done=ids.filter(id=>ans(id,state.q)).length;
  if(left<=0||(ids.length>0&&done===ids.length)) setGame({phase:"reveal"});
}
function makeQR(){ if(qrUrl||typeof QRCode==="undefined") return; const el=$("#qrsrc"); new QRCode(el,{text:JOIN_URL,width:512,height:512,colorDark:"#000000",colorLight:"#ffffff"}); const cv=el.querySelector("canvas"); if(cv) qrUrl=cv.toDataURL(); }

/* ---------------- big screen ---------------- */
function hostView(){
  const p=state.phase, q=Q[state.q], r=actOf(state.q), ids=Object.keys(players||{});
  if(p==="lobby"){
    makeQR();
    return `<div class="content"><div class="poster">
      <div class="meta presents" style="text-transform:none">MBe SOCIAL PRESENTS</div>
      <h1 class="ptitle glow">Haunted<br>Trivia</h1>
      <p class="tagline">Twenty questions. Four acts. Not everyone gets out.</p>
      <div class="billing">${ids.length?`<b>Starring</b> `+ids.map(id=>`<span style="white-space:nowrap">${esc(players[id].name)}</span>`).join(` <span class="sep">|</span> `):`<b>Starring</b> you. Scan the code to join.`}</div>
      <div class="date">This Halloween</div>
      <div class="lobbyrow"><div style="text-align:left"><div class="count">${ids.length} ${ids.length===1?"player":"players"}</div><div class="meta" style="color:#cfc6b9;margin:6px 0 14px">have entered</div>
        <div class="btns"><button class="btn" data-act="next" ${ids.length?"":"disabled"}>Start the game</button>${Sound.on?"":`<button class="btn quiet" data-act="sound">Turn on sound</button>`}<button class="btn quiet" data-act="reset">Reset</button></div></div>
        <div class="qrbox"><div class="meta" style="text-align:right">Scan<br>to play</div>${qrUrl?`<img src="${qrUrl}" alt="QR code to join">`:""}</div></div>
    </div></div>`;
  }
  if(p==="question"&&inIntro()){
    return `<div class="content bars"><div class="act"><div class="meta">Act ${r+1} of ${ACTS.length}</div><h2 class="glow">${ACTS[r].name}</h2><p>${esc(ACTS[r].line)}</p></div></div>`;
  }
  const rev=p==="reveal";
  if(p==="question"||rev){
    const counts=[0,0,0,0], done=ids.filter(id=>ans(id,state.q)).length;
    ids.forEach(id=>{const a=ans(id,state.q); if(a&&a.c>=0&&a.c<4) counts[a.c]++;}); const max=Math.max(1,...counts);
    let fastest=null; ids.forEach(id=>{const a=ans(id,state.q); if(a&&a.c===q.a&&(!fastest||a.ms<fastest.ms)) fastest={name:players[id].name,ms:a.ms};});
    const deal=!rev&&now()-state.startedAt<800;
    const answersHtml=`<div class="answers ${deal?"deal":""}">${q.o.map((o,i)=>`<div class="ans a${i} ${rev?(i===q.a?"win":"dim"):""}"><span class="ltr" aria-hidden="true">${"ABCD"[i]}</span><span class="key">${KEYS[i]}</span><span>${esc(o)}</span>${rev?`<span class="n">${counts[i]}</span><span class="bar" style="transform:scaleX(${counts[i]/max})"></span>`:""}</div>`).join("")}</div>`;
    const last=state.q>=Q.length-1, hasPic=q.pic||q.emoji;
    return `<div class="content"><div class="qtop"><div><div class="meta where">Act ${r+1}: ${ACTS[r].name} &nbsp;/&nbsp; ${state.q+1} of ${Q.length}</div><div class="qtext">${esc(q.t)}</div></div>
      <div class="qside"><div class="answered meta"><b>${done}/${ids.length}</b>answered</div>${rev?"":ring()}</div></div>
      <div class="qbody ${hasPic?"pic":""}">${panel(state.q)}${answersHtml}</div>
      ${rev?`<div class="revealbar"><div class="fact">${fastest?`<em>Fastest: ${esc(fastest.name)}, ${(fastest.ms/1000).toFixed(1)}s.</em> `:""}${esc(q.f)}</div>
        <div class="btns">${last?"":`<button class="btn quiet" data-act="board">Leaderboard</button>`}<button class="btn" data-act="next">${last?"Final results":"Next question"}</button></div></div>`
      :`<div class="revealbar"><span class="hint">Answer on your phone. The faster you answer, the more you score.</span><button class="btn quiet" data-act="next">End question</button></div>`}</div>`;
  }
  if(p==="board"){
    const s=standings().slice(0,5);
    return `<div class="content"><div class="headrow"><h2 class="glow">Still alive</h2><span class="meta" style="color:#d6cdc1">After ${state.q+1} of ${Q.length}</span></div>
      <div class="board">${s.map((x,i)=>`<div class="row" style="animation-delay:${i*110}ms"><span class="rk">${i+1}</span><span>${esc(x.name)}</span><span class="pts">${x.score.toLocaleString()}</span></div>`).join("")}</div>
      <div class="btns" style="justify-content:flex-end"><button class="btn" data-act="next">Next question</button></div></div>`;
  }
  const s=standings(),[a,b,c]=s;
  const pod=(x,cls,place)=>x?`<div class="pod ${cls}"><div class="meta" style="color:#ddd">${place}</div><div class="nm ${cls==="p1"?"glow":""}">${esc(x.name)}</div><div class="pts">${x.score.toLocaleString()} pts</div></div>`:"<div></div>";
  return `<div class="content"><div class="act" style="flex:0;padding-top:3vh;gap:8px"><div class="meta">The survivors</div></div>
    <div class="podium" style="margin-top:auto">${pod(b,"p2","Second")}${pod(a,"p1","Last one standing")}${pod(c,"p3","Third")}</div>
    <div class="board" style="margin-top:3vh">${s.slice(3,8).map((x,i)=>`<div class="row"><span class="rk">${i+4}</span><span>${esc(x.name)}</span><span class="pts">${x.score.toLocaleString()}</span></div>`).join("")}</div>
    <div class="btns" style="justify-content:flex-end"><button class="btn quiet" data-act="reset">New game</button></div></div>`;
}

/* ---------------- phones ---------------- */
function phoneView(){
  const p=state.phase, q=Q[state.q], r=actOf(state.q);
  const wrap=inner=>`<div class="phone">${inner}</div>`;
  const title=`<div class="meta presents" style="text-transform:none">MBe SOCIAL PRESENTS</div><div class="ptitle glow" style="font-size:6rem;margin-top:0">Haunted Trivia</div>`;
  if(loadErr) return wrap(`<div class="center">${title}<p class="err">${esc(loadErr)}</p></div>`);
  if(!state.run) return wrap(`<div class="center">${title}<div class="chip">${fb?"Waiting for the host to open the game":"Connecting…"}</div></div>`);
  const joined=!!(players&&players[PID]);
  if(!joined) return wrap(`<div class="center">${title}
    <div class="field" style="margin-top:22px"><input id="nm" maxlength="20" autocomplete="nickname" placeholder="Your name" aria-label="Your name" value="${esc(nameDraft)}"></div>
    ${joinErr?`<p class="err">${esc(joinErr)}</p>`:""}<button class="btn" data-act="join" style="width:100%">Enter the house</button>
    ${p!=="lobby"?`<p style="margin:0;color:#ccc">The game has started. You can still jump in.</p>`:""}</div>`);
  const s=standings(), me=s.findIndex(x=>x.id===PID), my=s[me]||{score:0};
  const foot=`<div class="foot"><span>${esc(players[PID].name)}</span><span>${my.score.toLocaleString()} pts</span></div>`;
  if(p==="lobby") return wrap(`<div class="center">${title}<div class="chip" style="margin-top:18px">You’re in. Watch the big screen.</div></div>${foot}`);
  if(p==="question"&&inIntro()) return wrap(`<div class="center act"><div class="meta">Act ${r+1}</div><h2 class="glow" style="font-size:5.5rem">${ACTS[r].name}</h2><p style="font-size:1.15rem">${esc(ACTS[r].line)}</p></div>${foot}`);
  if(p==="question"){
    const a=ans(PID,state.q);
    if(a) return wrap(`<div class="center"><div class="ans a${a.c}" style="width:110px;height:110px;justify-content:center;flex:none;padding:0"><span class="key" style="width:64px">${KEYS[a.c]}</span></div><div class="big">Locked in</div><div class="chip">${(a.ms/1000).toFixed(1)}s</div></div>${foot}`);
    if(now()-state.startedAt>LIMIT) return wrap(`<div class="center"><div class="big glow">Time’s up</div></div>${foot}`);
    return wrap(`<div class="ptop"><div><div class="meta">${state.q+1} of ${Q.length}</div><div class="qtext">${esc(q.t)}</div></div>${ring()}</div>${panel(state.q)}
      <div class="answers ${now()-state.startedAt<800?"deal":""}">${q.o.map((o,i)=>`<button class="ans a${i}" data-ans="${i}"><span class="ltr" aria-hidden="true">${"ABCD"[i]}</span><span class="key">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>${foot}`);
  }
  if(p==="reveal"||p==="board"){
    const a=ans(PID,state.q), got=pts(a,state.q);
    const head=!a?`<div class="big glow">Too slow</div>`:got?`<div class="big good">Correct</div><div class="chip">+${got} pts, ${(a.ms/1000).toFixed(1)}s</div>`:`<div class="big glow">Wrong</div>`;
    return wrap(`<div class="center">${head}<p style="margin:8px 0 0">Answer: <b>${esc(q.o[q.a])}</b></p><div class="chip">#${me+1} of ${s.length}</div></div>${foot}`);
  }
  return wrap(`<div class="center"><div class="meta">You finished</div><div class="big glow" style="font-size:7rem">#${me+1}</div><div class="chip">${my.score.toLocaleString()} points</div></div>${foot}`);
}

/* ---------------- render ---------------- */
function placeWorld(){ World.fit({left:0,top:0,width:innerWidth,height:innerHeight},"0"); }
function render(){
  let html=`<div class="stage">${ROLE==="host"?hostView():phoneView()}</div>`;
  if(fb&&!connected) html+=`<div class="status chip">Reconnecting…</div>`;
  World.setScene(curScene());
  if(ROLE==="host"){
    Sound.setMood(curScene());
    const ev=state.phase+":"+state.q+":"+(inIntro()?"i":"");
    if(ev!==lastEv){ if((state.phase==="question"&&inIntro())||state.phase==="final") Sound.stinger(); if(state.phase==="reveal") Sound.reveal(); lastEv=ev; }
  }
  if(html!==lastHtml){
    const f=document.activeElement&&document.activeElement.id==="nm";
    lastHtml=html; $("#app").innerHTML=html;
    const nm=$("#nm"); if(nm&&f){ nm.focus(); nm.setSelectionRange(nm.value.length,nm.value.length); }
  }
  placeWorld(); drawTimer();
}
document.addEventListener("click",e=>{
  const an=e.target.closest("[data-ans]"); if(an) return answer(+an.dataset.ans);
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  ({next,board:showBoard,reset:resetGame,join,sound:()=>Sound.toggle()})[b.dataset.act]?.();
});
document.addEventListener("input",e=>{ if(e.target.id==="nm") nameDraft=e.target.value; });
document.addEventListener("keydown",e=>{
  if(e.target.id==="nm"&&e.key==="Enter"){ e.preventDefault(); join(); return; }
  if(ROLE!=="host"||e.target.tagName==="INPUT"||e.repeat) return;
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); if(state.phase!=="final") next(); }
  if(e.key==="l"||e.key==="L") showBoard();
  if(e.key==="m"||e.key==="M") Sound.toggle();
});
addEventListener("resize",placeWorld);

/* ---------------- connect to Firebase ---------------- */
(async function boot(){
  render();
  try{
    const A=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const D=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const db=D.getDatabase(A.initializeApp(firebaseConfig));
    fb={db,D};
    D.onValue(D.ref(db,".info/serverTimeOffset"),s=>{offset=+s.val()||0});
    D.onValue(D.ref(db,".info/connected"),s=>{connected=!!s.val();render()});
    D.onValue(D.ref(db,"game"),s=>{
      const g=s.val();
      if(!g||!g.run){ if(ROLE==="host"&&!creating){ creating=true; newGame(); } render(); return; }
      state={run:String(g.run),phase:String(g.phase||"lobby"),q:Math.min(Math.max(+g.q||0,0),Q.length-1),startedAt:+g.startedAt||0};
      if(state.run!==subRun){
        unsubs.forEach(u=>u()); subRun=state.run; players={}; answers={};
        unsubs=[D.onValue(D.ref(db,"players/"+subRun),x=>{players=x.val()||{};render()}),
                D.onValue(D.ref(db,"answers/"+subRun),x=>{answers=x.val()||{};render()})];
      }
      render();
    },err=>{loadErr="Can’t reach the game database. The Firebase rules may have expired.";render()});
  }catch(e){ loadErr="Couldn’t load the game. Check your internet connection and refresh."; render(); }
  setInterval(tick,250);
})();
</script>
